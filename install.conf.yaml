- defaults:
    link:
      relink: true

- clean: ['~']

- create:
    - ~/.config
    - ~/.local/bin
    - ~/.local/share/fonts
    - ~/.1password

- link:
    # Shared configs (both platforms)
    ~/.config/tmux: .config/tmux
    ~/.config/nvim: .config/nvim
    ~/.config/oh-my-posh/: .config/oh-my-posh
    ~/.dotfiles: ''

    # Linux-specific configs (bash)
    ~/.config/bash:
      path: .config/bash
      if: '[ "$(uname -s)" = "Linux" ]'
    ~/.bashrc:
      force: true
      path: .bashrc
      if: '[ "$(uname -s)" = "Linux" ]'
    ~/.bash_profile:
      path: .bash_profile
      if: '[ "$(uname -s)" = "Linux" ]'
    ~/.config/1password/.agent-bridge.sh:
      create: true
      path: .config/bash/programs/1password/.agent-bridge.sh
      if: '[ "$(uname -s)" = "Linux" ]'

    # macOS-specific configs (zsh)
    ~/.config/zsh:
      path: .config/zsh
      if: '[ "$(uname -s)" = "Darwin" ]'
    ~/.zshrc:
      force: true
      path: .zshrc
      if: '[ "$(uname -s)" = "Darwin" ]'

- shell:
    - [git submodule update --init --recursive, Installing submodules]
